<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		:root {
			--ink: #15242b;
			--muted: #6c7b80;
			--paper: #f6f4ef;
			--panel: #fffdf9;
			--line: #dfe5df;
			--green: #1d8066;
			--green-dark: #125945;
			--mint: #dff2e8;
			--yellow: #f5c95c;
			--red: #c65345;
			--shadow: 0 18px 50px rgba(23, 51, 43, .08);
			--member-col-width: 112px;
		}

		* { box-sizing: border-box; }
		body {
			margin: 0;
			color: var(--ink);
			background: var(--paper);
			font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
		}
		body::before {
			content: "";
			position: fixed;
			inset: 0 0 auto;
			height: 330px;
			background: radial-gradient(circle at 86% 18%, rgba(245, 201, 92, .35), transparent 24%), linear-gradient(125deg, #dcefe4, #f6f4ef 62%);
			z-index: -1;
		}
		.wrap { width: min(1240px, calc(100% - 32px)); margin: 0 auto; padding: 44px 0 64px; }
		header { display: flex; justify-content: space-between; gap: 24px; align-items: end; margin-bottom: 28px; }
		.eyebrow { color: var(--green); font-weight: 800; letter-spacing: .14em; font-size: .78rem; }
		h1 { margin: 8px 0 0; font-family: Georgia, "Noto Serif TC", serif; font-size: clamp(2.15rem, 5vw, 4rem); line-height: 1; letter-spacing: -.03em; }
		.intro { max-width: 430px; margin: 0; color: var(--muted); line-height: 1.7; }
		.panel { background: rgba(255, 253, 249, .93); border: 1px solid rgba(214, 224, 217, .9); box-shadow: var(--shadow); }
		.controls { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; padding: 17px 20px; border-radius: 12px 12px 0 0; }
		.controls-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
		.hint { color: var(--muted); font-size: .88rem; }
		.bulk-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: .86rem; }
		.record-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: .86rem; }
		.export-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: .86rem; }
		.date-input, .history-select, .favorite-select { padding: 9px 8px; border: 1px solid #cddbd2; border-radius: 7px; color: var(--ink); background: white; font: inherit; }
		.date-input { width: 150px; }
		.history-select { min-width: 180px; }
		.favorite-select { max-width: 150px; }
		button { border: 0; border-radius: 7px; padding: 10px 15px; font: inherit; font-weight: 800; cursor: pointer; transition: transform .16s, background .16s; }
		button:hover { transform: translateY(-1px); }
		.primary { color: white; background: var(--green); }
		.primary:hover { background: var(--green-dark); }
		.ghost { color: var(--green-dark); background: var(--mint); }
		.bulk-price { width: 104px; padding: 9px 8px; border: 1px solid #cddbd2; border-radius: 7px; color: var(--ink); background: white; font: inherit; }
		.danger { color: var(--red); background: transparent; font-size: 1.1rem; padding: 6px 9px; }
		.table-shell { overflow-x: auto; border-top: 1px solid var(--line); position: relative; }
		.mobile-split { display: none; }
		table { width: 100%; min-width: 920px; border-collapse: collapse; table-layout: fixed; }
		th, td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: center; }
		th:last-child, td:last-child { border-right: 0; }
		thead th { height: 74px; padding: 10px 8px; background: #f7faf5; font-size: .84rem; white-space: normal; }
		thead th:first-child { width: 36px; min-width: 36px; position: sticky; left: 0; z-index: 6; background: #f7faf5; border-right: 2px solid var(--line); box-shadow: 1px 0 0 var(--line), 2px 0 0 rgba(21, 36, 43, .04); }
		thead th:nth-child(2) { width: 112px; min-width: 112px; max-width: 112px; text-align: center; padding-left: 0; padding-right: 0; position: sticky; left: 36px; z-index: 5; background: #f7faf5; border-right: 2px solid var(--line); box-shadow: 1px 0 0 var(--line), 2px 0 0 rgba(21, 36, 43, .04); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		thead th:nth-child(n+3):not(:last-child) { width: 112px; min-width: 112px; }
		thead th:last-child { width: 112px; min-width: 112px; }
		.slot-time { display: block; width: 100%; min-width: 0; border: 0; outline: 0; color: var(--ink); background: transparent; text-align: center; white-space: nowrap; overflow: visible; font: inherit; font-size: .86rem; font-weight: 700; line-height: 1.2; }
		.slot-time:focus { border-bottom: 1px solid var(--green); }
		.price { width: 82px; margin-top: 7px; padding: 5px 7px; border: 1px solid #cddbd2; border-radius: 5px; color: var(--ink); background: white; text-align: center; font: inherit; font-size: .8rem; }
		.attendee-count { display: block; margin-top: 5px; color: var(--green); font-size: .72rem; font-weight: 800; }
		.slot-remove { margin-top: 5px; padding: 2px 6px; color: var(--red); background: transparent; font-size: .75rem; }
		.add-slot-head { width: 120px; min-width: 120px; }
		.add-slot-button { padding: 7px 9px; color: var(--green-dark); background: var(--mint); font-size: .78rem; white-space: nowrap; }
		.add-slot-cell { min-width: 120px; background: #f7faf5; }
		.member-tools { display: flex; align-items: center; justify-content: center; gap: 1px; flex-wrap: wrap; text-align: center; width: 100%; max-width: 120px; overflow: hidden; margin: 0 auto; }
		.member-tools-title { display: block; width: 100%; margin-bottom: 1px; white-space: nowrap; font-size: .7rem; text-align: center; }
		.member-tools button { padding: 1px 2px; font-size: .56rem; white-space: nowrap; }
		.favorites-panel { margin: 0 0 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: #f7faf5; }
		.favorites-title { color: var(--green-dark); font-size: .8rem; font-weight: 900; letter-spacing: .08em; margin-bottom: 8px; }
		.favorite-list { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
		.favorite-chip { padding: 6px 8px; border: 1px solid #cddbd2; border-radius: 999px; color: var(--green-dark); background: white; font-size: .72rem; font-weight: 700; }
		.favorite-chip:hover { background: var(--mint); transform: translateY(-1px); }
		.favorite-chip:active, .favorite-chip.is-active { background: var(--green); color: white; border-color: var(--green); opacity: 1; }
		.slot-chip { color: var(--green-dark); }
		.slot-chip:hover { background: var(--mint); transform: translateY(-1px); }
		.slot-chip:active, .slot-chip.is-active { background: var(--green); color: white; border-color: var(--green); opacity: 1; }
		.slot-chip.is-added { cursor: default; background: #eef6ee; opacity: 1; }
		.slot-chip.is-added.is-active { background: var(--green); color: white; border-color: var(--green); }
		tbody th { width: 112px; min-width: 112px; max-width: 112px; padding: 9px 6px 9px 6px; background: var(--panel); position: sticky; left: 36px; z-index: 4; border-right: 2px solid var(--line); box-shadow: 1px 0 0 var(--line), 2px 0 0 rgba(21, 36, 43, .04); isolation: isolate; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
		tbody td.paid-cell { width: 36px; min-width: 36px; padding: 0; background: var(--panel); position: sticky; left: 0; z-index: 4; vertical-align: middle; border-right: 2px solid var(--line); box-shadow: 1px 0 0 var(--line), 2px 0 0 rgba(21, 36, 43, .04); isolation: isolate; }
		.name-wrap { display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%; min-width: 0; overflow: hidden; }
		.favorite { color: var(--yellow); background: transparent; padding: 5px; font-size: 1.15rem; line-height: 1; flex-shrink: 0; }
		.name-input { flex: 1 1 auto; width: 100%; min-width: 0; max-width: 100%; border: 0; border-bottom: 1px solid transparent; outline: 0; color: var(--ink); background: transparent; font: inherit; font-weight: 700; padding: 2px 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .74rem; text-align: center; }
		.name-input:focus { border-bottom-color: var(--green); }
		td { height: 61px; background: #fffefa; }
		.check { width: 100%; height: 100%; min-height: 60px; border-radius: 0; padding: 0; background: transparent; color: transparent; font-size: 1.4rem; }
		.check:hover { background: #f2f8f2; transform: none; }
		.check.active { color: var(--green-dark); background: var(--mint); }
		.check.active::after { content: "✓"; }
		.total-cell { color: var(--green-dark); background: #f8fbf5; font-weight: 900; }
		.paid-check { width: 20px; height: 20px; accent-color: var(--green); cursor: pointer; }
		.summary { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; margin-top: 22px; }
		.summary-card { padding: 22px; border-radius: 10px; }
		.bottom-actions { display: flex; justify-content: flex-end; margin-top: 18px; }
		.section-label { margin: 0 0 16px; color: var(--muted); font-size: .8rem; font-weight: 900; letter-spacing: .11em; }
		.grand { display: flex; align-items: end; justify-content: space-between; gap: 20px; }
		.grand strong { font-family: Georgia, serif; font-size: 2.5rem; color: var(--green-dark); }
		.grand span { color: var(--muted); font-size: .86rem; }
		.person-list { display: grid; gap: 10px; }
		.person-row { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 9px; border-bottom: 1px solid var(--line); }
		.person-row:last-child { border-bottom: 0; padding-bottom: 0; }
		.person-row b:last-child { color: var(--green-dark); }
		.empty { padding: 24px; color: var(--muted); text-align: center; }
		.mobile-note { display: none; color: var(--muted); font-size: .78rem; margin-top: 8px; }
		@media (max-width: 700px) {
			.wrap { width: min(100% - 20px, 1240px); padding-top: 28px; }
			header { display: block; }
			.intro { margin-top: 15px; }
			.summary { grid-template-columns: 1fr; }
			.mobile-note { display: block; }
			.table-shell > table { display: table; }
			.table-shell { overflow-x: auto; }
			.mobile-split { display: none; }
			.mobile-member-tools { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; padding: 10px; border-bottom: 1px solid var(--line); background: #f7faf5; }
			.mobile-member-tools button { padding: 7px 8px; font-size: .72rem; }
			.mobile-member-tools .favorite-select { flex: 1 1 100px; min-width: 100px; max-width: none; padding: 6px; font-size: .72rem; }
			.mobile-member-table, .mobile-schedule-table { width: 100%; min-width: 0; border-collapse: collapse; }
			.mobile-member-table th, .mobile-member-table td, .mobile-schedule-table th, .mobile-schedule-table td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: center; }
			.mobile-member-table th:last-child, .mobile-member-table td:last-child, .mobile-schedule-table th:last-child, .mobile-schedule-table td:last-child { border-right: 0; }
			.mobile-member-table th { padding: 8px 4px; background: #eef6ee; font-size: .78rem; }
				.mobile-member-table th:nth-child(2), .mobile-member-table td:nth-child(2) { width: 112px; min-width: 112px; max-width: 112px; }
			.mobile-member-table td { height: 52px; padding: 4px; background: var(--panel); }
			.mobile-member-table .name-wrap { justify-content: center; }
			.mobile-member-table .name-input { max-width: 110px; text-align: center; }
			.mobile-schedule { margin-top: 12px; overflow-x: auto; border-top: 1px solid var(--line); }
			.mobile-schedule-table { min-width: 940px; }
			.mobile-schedule-table th { height: 78px; padding: 6px 4px; background: #f7faf5; font-size: .74rem; }
			.mobile-schedule-table td { height: 58px; padding: 0; background: #fffefa; }
			.mobile-schedule-table .price { width: 70px; }
			.mobile-schedule-table .check { min-height: 56px; }
			.mobile-schedule-table .schedule-row-number { width: 42px; min-width: 42px; color: var(--muted); font-weight: 800; }
			table { min-width: 620px; }
			thead th:first-child, tbody td.paid-cell { width: 36px; min-width: 36px; }
				thead th:nth-child(2) { width: 112px; min-width: 112px; max-width: 112px; padding-left: 5px; }
				thead th:first-child, tbody td.paid-cell { width: 36px; min-width: 36px; background: var(--panel); }
				thead th:nth-child(2) { width: 112px; min-width: 112px; max-width: 112px; left: 36px; background: var(--panel); }
			tbody th { left: 36px; background: var(--panel); }
			thead th:first-child, thead th:nth-child(2), tbody td.paid-cell, tbody th { z-index: 6; box-shadow: 1px 0 0 var(--line), 2px 0 0 rgba(21, 36, 43, .04); }
			thead th:nth-child(n+3):not(:last-child) { width: 90px; min-width: 90px; padding-left: 0; padding-right: 0; }
			thead th:nth-child(n+3):not(:last-child) .slot-time { width: 100%; min-width: 0; padding-left: 0; padding-right: 0; font-size: 12px !important; letter-spacing: -.45px; overflow: visible; text-overflow: initial; white-space: nowrap; }
			.price { width: 60px; padding-left: 3px; padding-right: 3px; }
			thead th.add-slot-head { width: 72px; min-width: 72px; }
			thead th:last-child { width: 94px; min-width: 94px; }
			tbody th { padding-left: 10px; padding-right: 6px; }
			.member-tools { gap: 3px; }
			thead th:nth-child(2) .member-tools { width: 100px; justify-content: center; }
			thead th:nth-child(2) .member-tools-title { font-size: .7rem; text-align: center; }
			thead th:nth-child(2) .member-tools button, thead th:nth-child(2) .favorite-select { width: 100%; max-width: 100px; font-size: .64rem; }
			.member-tools button { padding: 4px 3px; }
			.name-wrap { gap: 1px; }
			tbody th .name-wrap { justify-content: center; }
			.name-input { min-width: 0; padding-left: 1px; padding-right: 1px; font-size: .78rem; }
			.name-wrap .favorite, .name-wrap .danger { padding-left: 2px; padding-right: 2px; }
		}
		@media print {
			body { background: white; }
			body::before, header, .controls, .bulk-bar, .record-bar, .export-bar, .mobile-note { display: none !important; }
			.wrap { width: 100%; padding: 0; }
			.panel { border: 0; box-shadow: none; }
			.table-shell { overflow: visible; }
			table { min-width: 0; font-size: 9px; }
			thead th { height: auto; padding: 5px 3px; }
			.slot-time { font-size: 9px; }
			.price { border: 0; padding: 2px; font-size: 8px; }
			.attendee-count { font-size: 8px; }
			.check { min-height: 25px; }
			td { height: 28px; }
		}
	</style>
</head>
<body>
	<main class="wrap">
		<section class="panel" aria-label="羽球費用分攤表">
			<div class="record-bar"><label for="recordDate">活動日期</label><input class="date-input" id="recordDate" type="date"><button class="ghost" id="saveRecord">儲存紀錄</button><select class="history-select" id="historySelect" aria-label="歷史紀錄"><option value="">選擇歷史紀錄</option></select><button class="ghost" id="loadRecord">載入</button><button class="danger" id="deleteRecord" title="刪除選取的歷史紀錄">刪除紀錄</button></div>
			<div class="bulk-bar"><span>全部時段場租</span><input class="bulk-price" id="bulkPrice" type="number" min="0" step="10" placeholder="輸入金額"><button class="ghost" id="applyPrice">一鍵代入</button></div>
			<div class="export-bar"><span>匯出目前紀錄</span><button class="ghost" id="exportJpg">匯出 JPG</button><button class="ghost" id="exportPdf">匯出 PDF</button><button class="ghost" id="exportExcel">匯出 Excel</button></div>
			<div class="favorites-panel" id="favoritesPanel">
				<div class="favorites-title">收藏成員</div>
				<div class="favorite-list" id="favoriteList"></div>
			</div>
			<div class="favorites-panel">
				<div class="favorites-title">新增時段</div>
				<div class="favorite-list" id="slotPresetList"></div>
			</div>
			<div class="table-shell">
				<table>
					<thead><tr id="slotHeader"><th>成員／時段</th></tr></thead>
					<tbody id="peopleBody"></tbody>
				</table>
				<div class="mobile-split" id="mobileSplit"></div>
			</div>
			<div class="mobile-note">表格可左右滑動查看完整時段。</div>
		</section>

		<section class="summary">
			<article class="panel summary-card"><p class="section-label">總場租</p><div class="grand"><strong id="grandTotal">$0</strong><span id="activeSlots">尚未選取時段</span></div></article>
			<article class="panel summary-card"><p class="section-label">個人應付金額 <span id="payerCountLabel">(0 人)</span></p><div class="person-list" id="summaryList"><div class="empty">新增成員後開始記帳</div></div></article>
		</section>
		<div class="bottom-actions"><button class="ghost" id="clearAll">一鍵清空</button></div>
	</main>
	<script>
		const slots = ['18:00-19:00', '19:00-20:00', '20:00-21:00', '21:00-22:00', '22:00-23:00', '23:00-24:00', '00:00-01:00', '01:00-02:00'];
		const today = () => new Date().toLocaleDateString('en-CA');
		const storageKeys = { history: 'badminton-split-history', favorites: 'badminton-split-favorites', current: 'badminton-split-current' };
		const readStorage = key => { try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch (error) { return []; } };
		const writeStorage = (key, value) => localStorage.setItem(key, JSON.stringify(value));
		const readCurrentState = () => { try { return JSON.parse(localStorage.getItem(storageKeys.current) || 'null'); } catch (error) { return null; } };
		const saveCurrentState = () => { try { localStorage.setItem(storageKeys.current, JSON.stringify(snapshot())); } catch (error) {} };
		const defaultFavorites = ['孟辰', '政廷', '奕誠', '書翰', '阿憲', '家安', '蕙妤', '國龍', '阿廷', '雅晴', '秉弘', '展玥', '志賢', '哲宇', '繼嶔'];
		const autoRemovedFavoriteNames = ['小名', '阿哲', '欣芸', '俊凱'];
		const slotPresets = Array.from({ length: 24 }, (_, index) => {
			const start = String(index).padStart(2, '0');
			const end = String((index + 1) % 24).padStart(2, '0');
			const normalizedEnd = end === '00' ? '24' : end;
			return `${start}:00-${normalizedEnd}:00`;
		});
		const state = { date: today(), prices: [], slotLabels: [], people: [], activeFavoriteNames: [], activeSlotLabels: [] };
		let history = readStorage(storageKeys.history);
		let favorites = readStorage(storageKeys.favorites);
		const requestedFavoriteNames = ['依依', '音彩', '文穎', '敬萱'];
		if (!favorites.length) { favorites = [...defaultFavorites.slice(), ...requestedFavoriteNames]; writeStorage(storageKeys.favorites, favorites); }
		else {
			const filteredFavorites = favorites.filter(name => !autoRemovedFavoriteNames.includes(name));
			const missingRequested = requestedFavoriteNames.filter(name => !filteredFavorites.includes(name));
			if (filteredFavorites.length !== favorites.length || missingRequested.length) {
				favorites = [...filteredFavorites, ...missingRequested];
				writeStorage(storageKeys.favorites, favorites);
			}
		}
		const header = document.querySelector('#slotHeader');
		const body = document.querySelector('#peopleBody');
		const money = value => '$' + Math.round(value).toLocaleString('zh-TW');
		const savedCurrentState = readCurrentState();
		if (savedCurrentState) { restore(savedCurrentState); }

		function updateMemberColumnWidth() {
			document.documentElement.style.setProperty('--member-col-width', '60px');
		}
		function renderHeader() {
			header.innerHTML = '<th>已付款</th><th><div class="member-tools"><strong class="member-tools-title">成員／時段</strong><button class="primary" id="addPerson">＋ 新增成員</button></div></th>' + (state.slotLabels.length ? state.slotLabels.map((_, index) => { const count = state.people.filter(person => person.attending[index]).length; const priceValue = Number.isFinite(state.prices[index]) ? state.prices[index] : 700; return `<th><input class="slot-time" type="text" value="${escapeHtml(state.slotLabels[index])}" data-slot-label="${index}" aria-label="時段 ${index + 1}"><input class="price" type="number" min="0" step="10" value="${priceValue}" data-price="${index}" placeholder="場租 $"><span class="attendee-count">${count} 人</span><button class="slot-remove" data-slot-remove="${index}" title="刪除這個時段">刪除</button></th>`; }).join('') : '') + '<th>個人合計</th>';
			header.querySelector('#addPerson').addEventListener('click', () => { state.people.push({ name: `成員 ${state.people.length + 1}`, attending: Array(state.slotLabels.length).fill(false), paid: false }); render(); });
			header.querySelectorAll('[data-slot-label]').forEach(input => { fitSlotLabel(input); input.addEventListener('input', event => { state.slotLabels[event.target.dataset.slotLabel] = event.target.value; fitSlotLabel(event.target); saveCurrentState(); }); });
			header.querySelectorAll('[data-price]').forEach(input => {
				input.addEventListener('input', event => { state.prices[event.target.dataset.price] = Number(event.target.value) || 0; });
				input.addEventListener('change', renderSummary);
			});
			header.querySelectorAll('[data-slot-remove]').forEach(button => button.addEventListener('click', () => removeSlot(Number(button.dataset.slotRemove))));
			renderMobileSplit();
		}
		function renderMobileSplit() {
			const container = document.querySelector('#mobileSplit');
			container.innerHTML = `<div class="favorites-panel"><div class="favorites-title">收藏成員</div><div class="favorite-list" id="mobileFavoriteList"></div></div><div class="mobile-member-tools"><button class="primary" id="mobileAddPerson">＋ 新增成員</button></div><table class="mobile-member-table"><thead><tr><th>已付款</th><th>成員</th></tr></thead><tbody>${state.people.length ? state.people.map((person, index) => `<tr><td><input class="paid-check" type="checkbox" ${person.paid ? 'checked' : ''} data-mobile-paid="${index}" aria-label="第 ${index + 1} 位成員已付款"></td><td><div class="name-wrap"><button class="favorite" data-mobile-favorite="${index}" title="收藏名字" aria-label="收藏 ${person.name}">${favorites.includes(person.name) ? '★' : '☆'}</button><input class="name-input" value="${escapeHtml(person.name)}" data-mobile-name="${index}" aria-label="第 ${index + 1} 位成員姓名"><button class="danger" data-mobile-remove="${index}" title="移除成員" aria-label="移除第 ${index + 1} 位成員">×</button></div></td></tr>`).join('') : '<tr><td class="empty" colspan="2">請先新增成員</td></tr>'}</tbody></table><div class="mobile-schedule"><table class="mobile-schedule-table"><thead><tr><th class="schedule-row-number">#</th>${state.slotLabels.map((label, index) => { const count = state.people.filter(person => person.attending[index]).length; return `<th><input class="slot-time" type="text" value="${escapeHtml(label)}" data-mobile-slot-label="${index}" aria-label="時段 ${index + 1}"><input class="price" type="number" min="0" step="10" value="${state.prices[index] || ''}" data-mobile-price="${index}" placeholder="場租 $"><span class="attendee-count">${count} 人</span><button class="slot-remove" data-mobile-slot-remove="${index}" title="刪除這個時段">刪除</button></th>`; }).join('')}<th class="add-slot-head"></th><th>合計</th></tr></thead><tbody>${state.people.map((person, personIndex) => `<tr><td class="schedule-row-number">${personIndex + 1}</td>${state.slotLabels.map((_, slotIndex) => `<td><button class="check ${person.attending[slotIndex] ? 'active' : ''}" data-mobile-person="${personIndex}" data-mobile-slot="${slotIndex}" aria-label="第 ${personIndex + 1} 位成員時段 ${slotIndex + 1}"></button></td>`).join('')}<td class="add-slot-cell"></td><td class="total-cell">${money(personTotal(person))}</td></tr>`).join('')}</tbody></table></div>`;
			container.querySelector('#mobileAddPerson').addEventListener('click', () => { state.people.push({ name: `成員 ${state.people.length + 1}`, attending: Array(state.slotLabels.length).fill(false), paid: false }); render(); });
			container.querySelectorAll('[data-mobile-slot-label]').forEach(input => { fitSlotLabel(input); input.addEventListener('input', event => { state.slotLabels[event.target.dataset.mobileSlotLabel] = event.target.value; fitSlotLabel(event.target); }); });
			container.querySelectorAll('[data-mobile-price]').forEach(input => { input.addEventListener('input', event => { state.prices[event.target.dataset.mobilePrice] = Number(event.target.value) || 0; }); input.addEventListener('change', renderSummary); });
			container.querySelectorAll('[data-mobile-slot-remove]').forEach(button => button.addEventListener('click', () => removeSlot(Number(button.dataset.mobileSlotRemove))));
			container.querySelectorAll('[data-mobile-person]').forEach(button => button.addEventListener('click', () => { state.people[button.dataset.mobilePerson].attending[button.dataset.mobileSlot] = !state.people[button.dataset.mobilePerson].attending[button.dataset.mobileSlot]; render(); }));
			container.querySelectorAll('[data-mobile-name]').forEach(input => input.addEventListener('input', event => { const nextValue = compactName(event.target.value); event.target.value = nextValue; state.people[event.target.dataset.mobileName].name = nextValue; renderSummary(); }));
			container.querySelectorAll('[data-mobile-paid]').forEach(input => input.addEventListener('change', event => { state.people[event.target.dataset.mobilePaid].paid = event.target.checked; renderSummary(); }));
			container.querySelectorAll('[data-mobile-favorite]').forEach(button => button.addEventListener('click', () => { const name = state.people[button.dataset.mobileFavorite].name.trim(); if (!name) return; favorites = favorites.includes(name) ? favorites.filter(savedName => savedName !== name) : [...favorites, name]; writeStorage(storageKeys.favorites, favorites); render(); }));
			container.querySelectorAll('[data-mobile-remove]').forEach(button => button.addEventListener('click', () => { state.people.splice(button.dataset.mobileRemove, 1); render(); }));
		}
		function fitSlotLabel(input) { const length = input.value.length; input.style.fontSize = `${Math.max(0.62, Math.min(0.86, 10.5 / Math.max(length, 1)))}rem`; }

		function renderFavorites() {
			const desktopRoot = document.querySelector('#favoriteList');
			const mobileRoot = document.querySelector('#mobileFavoriteList');
			state.activeFavoriteNames = state.people
				.map(person => (person.name || '').trim())
				.filter(Boolean)
				.filter(name => favorites.includes(name));
			const markup = favorites.length ? favorites.map(name => `<button class="favorite-chip ${state.activeFavoriteNames.includes(name) ? 'is-active' : ''}" data-add-favorite="${escapeHtml(name)}">${escapeHtml(name)}</button>`).join('') : '<span class="hint">尚無收藏成員</span>';
			if (desktopRoot) desktopRoot.innerHTML = markup;
			if (mobileRoot) mobileRoot.innerHTML = markup;
			if (desktopRoot) desktopRoot.querySelectorAll('[data-add-favorite]').forEach(button => button.addEventListener('click', () => {
				const name = button.dataset.addFavorite;
				const exists = state.people.some(person => person.name === name);
				if (exists) {
					state.people = state.people.filter(person => person.name !== name);
					render();
					return;
				}
				state.activeFavoriteNames = Array.from(new Set([...state.activeFavoriteNames, name]));
				state.people.push({ name, attending: Array(state.slotLabels.length).fill(false), paid: false });
				render();
			}));
			if (mobileRoot) mobileRoot.querySelectorAll('[data-add-favorite]').forEach(button => button.addEventListener('click', () => {
				const name = button.dataset.addFavorite;
				const exists = state.people.some(person => person.name === name);
				if (exists) {
					state.people = state.people.filter(person => person.name !== name);
					render();
					return;
				}
				state.activeFavoriteNames = Array.from(new Set([...state.activeFavoriteNames, name]));
				state.people.push({ name, attending: Array(state.slotLabels.length).fill(false), paid: false });
				render();
			}));
		}

		function renderSlotPresets() {
			const root = document.querySelector('#slotPresetList');
			if (!root) return;
			root.innerHTML = slotPresets.map(label => {
				const exists = state.slotLabels.includes(label);
				const isActive = state.activeSlotLabels.includes(label) || exists;
				return `<button class="favorite-chip slot-chip ${exists ? 'is-added' : ''} ${isActive ? 'is-active' : ''}" data-add-slot="${escapeHtml(label)}">${escapeHtml(label)}</button>`;
			}).join('');
			root.querySelectorAll('[data-add-slot]').forEach(button => button.addEventListener('click', () => {
				const label = button.dataset.addSlot;
				if (state.slotLabels.includes(label)) {
					const index = state.slotLabels.indexOf(label);
					if (index >= 0) {
						state.activeSlotLabels = state.activeSlotLabels.filter(activeLabel => activeLabel !== label);
						state.slotLabels.splice(index, 1);
						state.prices.splice(index, 1);
						state.people.forEach(person => person.attending.splice(index, 1));
						render();
					}
					return;
				}
				state.activeSlotLabels = Array.from(new Set([...state.activeSlotLabels, label]));
				state.slotLabels.push(label);
				state.prices.push(700);
				state.people.forEach(person => person.attending.push(false));
				render();
			}));
		}

		function renderHistory() {
			const select = document.querySelector('#historySelect');
			select.innerHTML = '<option value="">選擇歷史紀錄</option>' + history.slice().sort((first, second) => second.date.localeCompare(first.date)).map(record => `<option value="${record.id}">${escapeHtml(record.date)} · ${escapeHtml(record.peopleSummary)}</option>`).join('');
		}

		function compactName(value) {
			return String(value ?? '').trim();
		}

		function render() {
			updateMemberColumnWidth();
			renderHeader();
			body.innerHTML = state.people.length ? state.people.map((person, personIndex) => `<tr><td class="paid-cell"><input class="paid-check" type="checkbox" ${person.paid ? 'checked' : ''} data-paid="${personIndex}" aria-label="${person.name} 已付款"></td><th><div class="name-wrap"><button class="favorite" data-favorite="${personIndex}" title="收藏名字" aria-label="收藏 ${person.name}">${favorites.includes(person.name) ? '★' : '☆'}</button><input class="name-input" value="${escapeHtml(compactName(person.name))}" data-name="${personIndex}" aria-label="成員姓名"><button class="danger" data-remove="${personIndex}" title="移除成員" aria-label="移除成員">×</button></div></th>${state.slotLabels.map((_, slotIndex) => `<td><button class="check ${person.attending[slotIndex] ? 'active' : ''}" data-person="${personIndex}" data-slot="${slotIndex}" aria-label="${person.name} ${escapeHtml(state.slotLabels[slotIndex])}"></button></td>`).join('')}<td class="total-cell">${money(personTotal(person))}</td></tr>`).join('') : `<tr><td class="empty" colspan="${state.slotLabels.length + 3}">請新增第一位成員</td></tr>`;
			body.querySelectorAll('[data-person]').forEach(button => button.addEventListener('click', () => { state.people[button.dataset.person].attending[button.dataset.slot] = !state.people[button.dataset.person].attending[button.dataset.slot]; render(); }));
			body.querySelectorAll('[data-name]').forEach(input => input.addEventListener('input', event => { const nextValue = compactName(event.target.value); event.target.value = nextValue; state.people[event.target.dataset.name].name = nextValue; renderSummary(); }));
			body.querySelectorAll('[data-favorite]').forEach(button => button.addEventListener('click', () => { const name = state.people[button.dataset.favorite].name.trim(); if (!name) return; favorites = favorites.includes(name) ? favorites.filter(savedName => savedName !== name) : [...favorites, name]; writeStorage(storageKeys.favorites, favorites); render(); }));
			body.querySelectorAll('[data-paid]').forEach(input => input.addEventListener('change', event => { state.people[event.target.dataset.paid].paid = event.target.checked; renderSummary(); }));
			body.querySelectorAll('[data-remove]').forEach(button => button.addEventListener('click', () => { state.people.splice(button.dataset.remove, 1); render(); }));
			renderSummary();
			renderFavorites();
			renderSlotPresets();
			renderHistory();
			document.querySelector('#recordDate').value = state.date;
			saveCurrentState();
		}

		function snapshot() { return JSON.parse(JSON.stringify({ date: state.date, prices: state.prices, slotLabels: state.slotLabels, people: state.people })); }
		function restore(saved) { const labels = Array.isArray(saved.slotLabels) ? saved.slotLabels.slice() : []; const count = labels.length; state.date = saved.date || today(); state.slotLabels = labels; state.prices = Array.from({ length: count }, (_, index) => Number(saved.prices?.[index]) || 700); state.people = Array.isArray(saved.people) ? saved.people.filter(person => !autoRemovedFavoriteNames.includes(person.name || '')).map(person => ({ name: compactName(person.name || '未命名成員'), paid: Boolean(person.paid), attending: Array.from({ length: count }, (_, index) => Boolean(person.attending?.[index])) })) : []; render(); }
		function formatSlotLabel(index) { const start = (18 + index) % 24; const end = (start + 1) % 24; return `${String(start).padStart(2, '0')}:00-${String(end).padStart(2, '0')}:00`; }
		function addSlot() { const index = state.slotLabels.length; state.slotLabels.push(formatSlotLabel(index)); state.prices.push(700); state.people.forEach(person => person.attending.push(false)); render(); }
		function removeSlot(index) { if (state.slotLabels.length === 0) return; const removedLabel = state.slotLabels[index]; state.slotLabels.splice(index, 1); state.prices.splice(index, 1); state.people.forEach(person => person.attending.splice(index, 1)); state.activeSlotLabels = state.activeSlotLabels.filter(label => label !== removedLabel); render(); }
		function downloadBlob(blob, filename) { const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = filename; link.click(); setTimeout(() => URL.revokeObjectURL(link.href), 1000); }
		function exportJpg() {
			const canvas = document.createElement('canvas'); const leftWidth = 330; const slotWidth = 170; const totalWidth = 180; const width = leftWidth + slotWidth * state.slotLabels.length + totalWidth + 40; const headerHeight = 116; const rowHeight = 64; const height = 145 + headerHeight + state.people.length * rowHeight + 45; canvas.width = width; canvas.height = height; const context = canvas.getContext('2d');
			context.fillStyle = '#fffdf9'; context.fillRect(0, 0, width, height); context.fillStyle = '#15242b'; context.font = 'bold 34px Microsoft JhengHei, sans-serif'; context.fillText('羽球場租分攤', 35, 43); context.font = '20px Microsoft JhengHei, sans-serif'; context.fillText(`活動日期：${state.date}`, 35, 78); context.fillStyle = '#f1f7f1'; context.fillRect(20, 105, width - 40, headerHeight); context.fillStyle = '#15242b'; context.font = 'bold 18px Microsoft JhengHei, sans-serif'; context.fillText('已付款 / 成員', 38, 166);
			state.slotLabels.forEach((label, index) => { const x = leftWidth + index * slotWidth; const center = x + slotWidth / 2; context.textAlign = 'center'; context.fillStyle = '#15242b'; context.font = 'bold 16px Microsoft JhengHei, sans-serif'; context.fillText(label, center, 137, slotWidth - 12); context.fillStyle = '#125945'; context.font = 'bold 15px Microsoft JhengHei, sans-serif'; context.fillText(`場租 $${state.prices[index] || 0}`, center, 163); context.fillStyle = '#6c7b80'; context.font = '14px Microsoft JhengHei, sans-serif'; context.fillText(`${state.people.filter(person => person.attending[index]).length} 人`, center, 188); }); context.textAlign = 'left'; context.fillStyle = '#15242b'; context.font = 'bold 18px Microsoft JhengHei, sans-serif'; context.fillText('個人合計', leftWidth + state.slotLabels.length * slotWidth + 20, 166);
			state.people.forEach((person, rowIndex) => { const y = 105 + headerHeight + rowIndex * rowHeight; context.strokeStyle = '#dfe5df'; context.beginPath(); context.moveTo(20, y); context.lineTo(width - 20, y); context.stroke(); context.fillStyle = '#15242b'; context.font = '17px Microsoft JhengHei, sans-serif'; context.fillText(`${person.paid ? '✓' : ''}  ${person.name}`, 38, y + 39); person.attending.forEach((attending, slotIndex) => { const x = leftWidth + slotIndex * slotWidth; context.fillStyle = attending ? '#dff2e8' : '#fffdf9'; context.fillRect(x, y + 1, slotWidth, rowHeight - 2); context.textAlign = 'center'; context.fillStyle = attending ? '#125945' : '#6c7b80'; context.font = 'bold 27px sans-serif'; context.fillText(attending ? '✓' : '－', x + slotWidth / 2, y + 40); }); context.textAlign = 'left'; context.fillStyle = '#125945'; context.font = 'bold 18px Microsoft JhengHei, sans-serif'; context.fillText(money(personTotal(person)), leftWidth + state.slotLabels.length * slotWidth + 20, y + 39); });
			canvas.toBlob(blob => downloadBlob(blob, `羽球分攤-${state.date}.jpg`), 'image/jpeg', .92);
		}
		function exportExcel() { const rows = [['活動日期', state.date], [], ['已付款', '成員', ...state.slotLabels.map((label, index) => `${label}（場租 $${state.prices[index] || 0}）`), '個人合計']]; state.people.forEach(person => rows.push([person.paid ? '是' : '否', person.name, ...person.attending.map(attending => attending ? '出席' : ''), money(personTotal(person))])); const html = `<html><head><meta charset="UTF-8"></head><body><table border="1">${rows.map(row => `<tr>${row.map(cell => `<td>${escapeHtml(cell)}</td>`).join('')}</tr>`).join('')}</table></body></html>`; downloadBlob(new Blob([`\ufeff${html}`], { type: 'application/vnd.ms-excel' }), `羽球分攤-${state.date}.xls`); }
		document.querySelector('#exportJpg').addEventListener('click', exportJpg);
		document.querySelector('#exportExcel').addEventListener('click', exportExcel);
		document.querySelector('#exportPdf').addEventListener('click', () => window.print());

		function personTotal(person) {
			const total = state.prices.reduce((sum, price, index) => {
				const attendees = state.people.filter(item => item.attending[index]).length;
				return sum + (person.attending[index] && attendees ? price / attendees : 0);
			}, 0);
			return Math.ceil(total / 10) * 10;
		}
		function renderSummary() {
			updateMemberColumnWidth();
			const total = state.prices.reduce((sum, price, index) => sum + (state.people.some(person => person.attending[index]) ? price : 0), 0);
			const used = state.prices.filter((_, index) => state.people.some(person => person.attending[index])).length;
			const payerCount = state.people.filter(person => person.attending.some(Boolean)).length;
			document.querySelector('#grandTotal').textContent = money(total);
			document.querySelector('#activeSlots').textContent = used ? `${used} 個時段已計入` : '尚未選取時段';
			document.querySelector('#payerCountLabel').textContent = `(${payerCount} 人)`;
			document.querySelector('#summaryList').innerHTML = state.people.length ? state.people.map(person => {
				const attendingCount = person.attending.filter(Boolean).length;
				return `<div class="person-row"><span>${escapeHtml(compactName(person.name)) || '未命名成員'}${person.paid ? ' <small>已付款</small>' : ''}</span><b>${money(personTotal(person))}<br><small>時數：${attendingCount}</small></b></div>`;
			}).join('') : '<div class="empty">新增成員後開始記帳</div>';
			saveCurrentState();
		}
		function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character])); }
		document.querySelector('#recordDate').addEventListener('change', event => { state.date = event.target.value || today(); saveCurrentState(); });
		document.querySelector('#saveRecord').addEventListener('click', () => { const record = { id: `${state.date}-${Date.now()}`, date: state.date, peopleSummary: state.people.map(person => person.name).join('、') || '沒有成員', data: snapshot() }; history = history.filter(savedRecord => savedRecord.date !== state.date); history.push(record); writeStorage(storageKeys.history, history); renderHistory(); document.querySelector('#historySelect').value = record.id; });
		document.querySelector('#loadRecord').addEventListener('click', () => { const record = history.find(savedRecord => savedRecord.id === document.querySelector('#historySelect').value); if (record) restore(record.data); });
		document.querySelector('#deleteRecord').addEventListener('click', () => { const id = document.querySelector('#historySelect').value; if (!id) return; history = history.filter(record => record.id !== id); writeStorage(storageKeys.history, history); renderHistory(); });
		document.querySelector('#applyPrice').addEventListener('click', () => { const input = document.querySelector('#bulkPrice'); const price = Number(input.value); if (!input.value || !Number.isFinite(price) || price < 0) { input.focus(); return; } state.prices.fill(price); render(); input.value = price; });
		document.querySelector('#clearAll').addEventListener('click', () => { if (!confirm('確定要清空所有成員、場租與付款資料嗎？')) return; state.prices.fill(0); state.people.length = 0; render(); });
		render();
	</script>
